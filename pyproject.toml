[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnintel"
version = "4.0.0"
description = "Leakage-free churn prediction with calibrated probabilities, survival-based CLV and profit-optimal retention targeting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vinay" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "optuna>=3.4",
    "shap>=0.44",
    "lifelines>=0.27",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "streamlit>=1.32"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.25", "ruff>=0.4", "imbalanced-learn>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["churnintel", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["churnintel", "api"]
