name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test (trains a fast model bundle in a temp dir)
        run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churn-intel:ci .
      - name: Smoke-test the API container
        run: |
          docker run -d -p 8000:8000 --name api churn-intel:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/v1/predict -H 'Content-Type: application/json' \
            -d '{"SeniorCitizen":0,"Partner":"No","Dependents":"No","tenure":3,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":98.5,"TotalCharges":295.5}'
