services:
  api:
    build: .
    image: churn-intel:latest
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build: .
    image: churn-intel:latest
    depends_on:
      - api
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    healthcheck:
      disable: true
    restart: unless-stopped
