# ─────────────────────────────────────────────────────────────────────────────
# Telco Churn Intelligence — master configuration
# Every number that drives training, evaluation and business decisions lives here.
# ─────────────────────────────────────────────────────────────────────────────
project:
  name: telco-churn-intelligence
  version: "4.0.0"
  random_state: 42
  n_jobs: -1

paths:
  raw_data: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  artifacts_dir: artifacts
  reports_dir: reports
  figures_dir: reports/figures

data:
  source_url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  test_size: 0.20          # held-out test set, touched exactly once at the end
  sample_frac: null        # e.g. 0.3 for quick experiments; null = full data

features:
  engineered: true
  exclude: [gender]        # no predictive signal (ablation A3) + fairness hygiene

cv:
  n_splits: 5
  n_repeats: 3             # repeated stratified K-fold for model selection (15 folds)
  tuning_splits: 5         # folds inside every Optuna trial

tuning:
  enabled: true
  n_trials:
    logreg: 30
    random_forest: 25
    xgboost: 40
    lightgbm: 40
    catboost: 15
  timeout_seconds: 600     # per model family

models:
  candidates: [logreg, random_forest, xgboost, lightgbm, catboost]
  ensembles: [soft_voting, stacking]
  ensemble_size: 3         # top-k tuned models combined by the ensembles
  selection_rule: one_se   # one_se (ESL 1-SE rule) | one_se_paired (stricter, paired folds) | best
  complexity_order: [logreg, lightgbm, xgboost, catboost, random_forest, soft_voting, stacking]

calibration:
  method: auto             # auto (lowest CV Brier) | sigmoid | isotonic | none
  cv: 5

evaluation:
  bootstrap_samples: 2000
  ci_level: 0.95
  lift_fractions: [0.10, 0.20, 0.30]
  risk_tiers:              # calibrated-probability cut-offs
    high: 0.50
    medium: 0.25

business:
  currency: USD
  gross_margin: 0.60       # contribution margin on monthly revenue (assumption)
  clv:
    method: survival       # survival (Cox PH expected remaining months) | horizon
    horizon_months: 24
    cox_penalizer: 0.01
  # Next-best-action menu. Costs and save rates are ILLUSTRATIVE assumptions —
  # replace them with your own campaign data. Profit model: Neslin et al. (2006).
  actions:
    retention_call:
      label: "Retention specialist call + 1-month bill credit for moving to a 12-month contract"
      contact_cost: 25.0
      incentive_cost: 60.0
      save_rate: 0.35
    email_offer:
      label: "Personalised email + $20 bill credit on contract upgrade"
      contact_cost: 2.0
      incentive_cost: 20.0
      save_rate: 0.12
  threshold_policy_action: retention_call
  threshold_scenarios:     # incentive cost of the threshold policy's action
    low_cost: 30.0
    base: 60.0
    high_cost: 120.0
  sensitivity:
    save_rates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
    incentive_costs: [20, 40, 60, 80, 100, 120, 150]

fairness:
  groups: [gender, SeniorCitizen]

monitoring:
  psi_bins: 10
  psi_warn: 0.10
  psi_alert: 0.25

explain:
  background_rows: 200
  summary_rows: 1000
  top_k_reasons: 3
